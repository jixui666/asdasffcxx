name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package uuvpn (SFI)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -clonedSourcePackagesDirPath .spm-cache \
            -resolvePackageDependencies

      # 两套宿主身份各编译一次：
      #   mha  = com.apple.mobile.MobileHouseArrest（与 3105 完全一致，MCM 租约身份）
      #   chat = com.uuvpn.chat（普通 App 身份，自签安装不会因冒用系统服务而闪退）
      - name: Build Release (host id = MobileHouseArrest)
        run: |
          set -o pipefail
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-mha \
            build 2>&1 | tee build-mha.log | tail -n 200

      - name: Build Release (host id = com.uuvpn.chat)
        run: |
          set -o pipefail
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            APP_BUNDLE_IDENTIFIER=com.uuvpn.chat \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-chat \
            build 2>&1 | tee build-chat.log | tail -n 200

      # 关键：逐层 ad-hoc 签名，让包内每个 Mach-O 的 CodeDirectory 与自身 Mach-O
      # 自洽（apptrace / libapptracecore / Library.framework / appex / dylib 全部覆盖）。
      # 之前交付的“剥离全部签名”版本会让部分重签工具（全能签等）在预校验阶段
      # 报 “CodeDirectory 与 Mach-O 不一致”，因为它们并不处理“完全没有签名”的包。
      - name: Ad-hoc sign & package both variants
        run: |
          set -euo pipefail

          # 1) 先清掉构建留下的签名与非运行文件（.bak/.til/.DS_Store），
          #    再逐层 ad-hoc 签名。否则 CodeResources 会把这些“工具喜欢顺手删掉”
          #    的文件封存进去，重签后就会出现
          #    “一个密封资源已丢失或失效 / a sealed resource is missing or invalid”。
          # versioned framework（Libbox.framework/Versions/A + Versions/Current 符号链接）
          # 在 zip 里以符号链接保存，Windows 上的重签工具（全能签等）解包时无法还原，
          # 结构被拆坏 → “密封资源已丢失或失效 / CodeDirectory 与 Mach-O 不一致”。
          # 打包前统一扁平化，ipa 内不再出现符号链接。
          flatten_frameworks() {
            APP="$1"
            while IFS= read -r -d '' fw; do
              if [ -d "$fw/Versions" ]; then
                ver="$(readlink "$fw/Versions/Current" 2>/dev/null || echo A)"
                [ -d "$fw/Versions/$ver" ] || ver="A"
                for item in "$fw/Versions/$ver"/*; do
                  [ -e "$item" ] || continue
                  name="$(basename "$item")"
                  rm -rf "$fw/$name"
                  cp -R "$item" "$fw/$name"
                done
                rm -rf "$fw/Versions"
                echo "flattened framework: $fw (was Versions/$ver)"
              fi
            done < <(find "$APP" -type d -name '*.framework' -print0)
          }

          # iOS 会把 <app>/Frameworks 视为“嵌入式 framework 目录”，重签工具会对其中
          # 每个条目做 framework 校验。apptrace / libapptracecore 是 3105 自带的老
          # dylib，没有 Modules、没有版本段，工具经常在这儿翻车（签不上 / 密封资源
          # 丢失）。打包前把它们挪到 <app>/Collect/，运行期 dlopen 两个目录都会试。
          relocate_collect_frameworks() {
            APP="$1"
            mkdir -p "$APP/Collect"
            for name in apptrace.framework libapptracecore.framework; do
              if [ -d "$APP/Frameworks/$name" ]; then
                rm -rf "$APP/Collect/$name"
                mv "$APP/Frameworks/$name" "$APP/Collect/$name"
                echo "relocated: Frameworks/$name -> Collect/$name"
              fi
            done
          }

          # Xcode 的 Embed Frameworks 阶段会把 Libbox.framework 走过
          # builtin-copy -bitcode-strip，把 57 MB 的 dylib 削成 51 KB 的空壳
          # （签名工具因此拒签、装上也直接崩）。打包时用 xcframework 里的原始
          # framework 覆盖回去。
          # Libbox.xcframework 的 ios-arm64 切片是 **静态库**（file 显示
          # "current ar archive"），链接期静态并入 Library.framework / 主程序，
          # 运行期不需要它作为 dylib 存在。Xcode 的 Embed 阶段却会把它当动态
          # framework 拷进去，还用 -bitcode-strip 削成 51 KB 的空壳 —— 这正是
          # 重签工具报 “不是 Mach-O / 密封资源丢失 / CodeDirectory 不一致”的
          # 直接原因。这里直接从包内删掉，静态链接的代码不受影响。
          drop_static_libbox() {
            APP="$1"
            if [ -d "$APP/Frameworks/Libbox.framework" ]; then
              du -sh "$APP/Frameworks/Libbox.framework" || true
              rm -rf "$APP/Frameworks/Libbox.framework"
              echo "removed static Libbox.framework from app bundle"
            else
              echo "no Libbox.framework in bundle (static link only)"
            fi
          }

          clean_app() {
            APP="$1"
            drop_static_libbox "$APP"
            flatten_frameworks "$APP"
            relocate_collect_frameworks "$APP"
            find "$APP" -type f \( -name '*.bak' -o -name '*.til' -o -name '.DS_Store' \) -delete 2>/dev/null || true
            find "$APP" -type d -name '_CodeSignature' -prune -exec rm -rf {} + 2>/dev/null || true
            find "$APP" -type f -name 'embedded.mobileprovision' -delete 2>/dev/null || true
            while IFS= read -r -d '' f; do
              if file -b "$f" 2>/dev/null | grep -q 'Mach-O'; then
                codesign --remove-signature "$f" >/dev/null 2>&1 || true
              fi
            done < <(find "$APP" -type f -print0)
          }

          sign_app() {
            APP="$1"
            for fw in "$APP"/Frameworks/*.framework "$APP"/Collect/*.framework; do
              [ -d "$fw" ] || continue
              codesign --force --sign - --timestamp=none "$fw" \
                || echo "WARN: codesign failed for $fw"
            done
            for appex in "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
              [ -d "$appex" ] || continue
              for fw in "$appex"/Frameworks/*.framework; do
                [ -d "$fw" ] || continue
                codesign --force --sign - --timestamp=none "$fw" \
                  || echo "WARN: codesign failed for $fw"
              done
              codesign --force --sign - --timestamp=none "$appex" \
                || echo "WARN: codesign failed for $appex"
            done
            while IFS= read -r -d '' dylib; do
              codesign --force --sign - --timestamp=none "$dylib" \
                || echo "WARN: codesign failed for $dylib"
            done < <(find "$APP" -type f -name '*.dylib' -print0)
            # versioned framework（Libbox.framework 带 Versions/A）在 --deep 下由
            # codesign 自己遍历签名更稳，失败也不阻塞打包
            codesign --force --deep --sign - --timestamp=none "$APP" \
              || echo "WARN: deep codesign of $APP reported issues"
          }

          package() {
            APP="$1"
            OUT="$2"
            test -d "$APP" || { echo "missing $APP"; exit 1; }
            clean_app "$APP"
            sign_app "$APP"
            echo "--- $OUT ---"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
            echo "--- frameworks shipped ---"
            ls -1 "$APP/Frameworks" 2>/dev/null || true
            echo "--- collect dir ---"
            ls -1 "$APP/Collect" 2>/dev/null || true
            echo "--- plist inventory ---"
            for pl in "$APP/Info.plist" "$APP"/PlugIns/*.appex/Info.plist "$APP"/Extensions/*.appex/Info.plist; do
              [ -f "$pl" ] || continue
              echo "$pl"
              /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$pl" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$pl" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$pl" 2>/dev/null || true
            done
            echo "--- static Libbox symbols in Library.framework ---"
            nm -gU "$APP/Frameworks/Library.framework/Library" 2>/dev/null | grep -c -i libbox || echo 0
            echo "--- mach-o inventory ---"
            find "$APP" -type f -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" 2>/dev/null | grep -q 'Mach-O'; then
                printf '%s :: %s\n' "${f#$APP/}" "$(file -b "$f")"
              fi
            done
            echo "--- Libbox.framework layout ---"
            ls -la "$APP/Frameworks/Libbox.framework" 2>/dev/null || true
            ls -la "$APP/Frameworks/Libbox.framework/Versions" 2>/dev/null || true
            echo "--- verification (informational) ---"
            codesign --verify --deep --strict --verbose=2 "$APP" > verify.log 2>&1 || true
            tail -n 12 verify.log || true
            echo "--- leftover .bak/.til ---"
            find "$APP" -type f \( -name '*.bak' -o -name '*.til' \) | head -n 5 || true
            rm -rf Payload "$OUT"
            mkdir -p Payload
            cp -R "$APP" Payload/
            /usr/bin/zip -qry "$OUT" Payload
            rm -rf Payload
            ls -lh "$OUT"
            unzip -l "$OUT" | grep -E 'Frameworks/(apptrace|libapptracecore)\.framework/(apptrace|libapptracecore)$' || true
            unzip -l "$OUT" | grep -E 'Payload/uuvpn.app/(links|shell)\.txt' || true
            /usr/bin/unzip -Z -1 "$OUT" > /dev/null 2>&1 || true
            unzip -Z -l "$OUT" | awk '$1 ~ /^l/ {print "symlink: " $NF; c++} END {print "symlink entries:", c+0}'
          }

          package "build-mha/Build/Products/Release-iphoneos/uuvpn.app" uuvpn-mha-adhoc.ipa
          package "build-chat/Build/Products/Release-iphoneos/uuvpn.app" uuvpn-chat-adhoc.ipa

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uuvpn-ipa
          path: |
            uuvpn-mha-adhoc.ipa
            uuvpn-chat-adhoc.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-mha.log
            build-chat.log
          if-no-files-found: ignore
          retention-days: 14
