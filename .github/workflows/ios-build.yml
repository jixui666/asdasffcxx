name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uuvpn (SFI, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -clonedSourcePackagesDirPath .spm-cache \
            -resolvePackageDependencies

      - name: Build (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build 2>&1 | tee build.log | tail -n 400

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
