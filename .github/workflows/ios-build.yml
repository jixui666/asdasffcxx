name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & package uuvpn (SFI)
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Resolve Swift packages
        run: |
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -clonedSourcePackagesDirPath .spm-cache \
            -resolvePackageDependencies

      # 两套宿主身份各编译一次：
      #   mha  = com.apple.mobile.MobileHouseArrest（与 3105 完全一致，MCM 租约身份）
      #   chat = com.uuvpn.chat（普通 App 身份，自签安装不会因冒用系统服务而闪退）
      - name: Build Release (host id = MobileHouseArrest)
        run: |
          set -o pipefail
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-mha \
            build 2>&1 | tee build-mha.log | tail -n 200

      - name: Build Release (host id = com.uuvpn.chat)
        run: |
          set -o pipefail
          xcodebuild -project uuvpn.xcodeproj -scheme SFI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            APP_BUNDLE_IDENTIFIER=com.uuvpn.chat \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-chat \
            build 2>&1 | tee build-chat.log | tail -n 200

      # 关键：逐层 ad-hoc 签名，让包内每个 Mach-O 的 CodeDirectory 与自身 Mach-O
      # 自洽（apptrace / libapptracecore / Library.framework / appex / dylib 全部覆盖）。
      # 之前交付的“剥离全部签名”版本会让部分重签工具（全能签等）在预校验阶段
      # 报 “CodeDirectory 与 Mach-O 不一致”，因为它们并不处理“完全没有签名”的包。
      - name: Ad-hoc sign & package both variants
        run: |
          set -euo pipefail

          sign_app() {
            APP="$1"
            for fw in "$APP"/Frameworks/*.framework; do
              [ -d "$fw" ] || continue
              codesign --force --sign - --timestamp=none "$fw"
            done
            for appex in "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
              [ -d "$appex" ] || continue
              for fw in "$appex"/Frameworks/*.framework; do
                [ -d "$fw" ] || continue
                codesign --force --sign - --timestamp=none "$fw"
              done
              codesign --force --sign - --timestamp=none "$appex"
            done
            while IFS= read -r -d '' dylib; do
              codesign --force --sign - --timestamp=none "$dylib"
            done < <(find "$APP" -type f -name '*.dylib' -print0)
            codesign --force --sign - --timestamp=none "$APP"
          }

          package() {
            APP="$1"
            OUT="$2"
            test -d "$APP" || { echo "missing $APP"; exit 1; }
            sign_app "$APP"
            echo "--- $OUT ---"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -n 3
            rm -rf Payload "$OUT"
            mkdir -p Payload
            cp -R "$APP" Payload/
            /usr/bin/zip -qry "$OUT" Payload
            rm -rf Payload
            ls -lh "$OUT"
            unzip -l "$OUT" | grep -E 'Frameworks/(apptrace|libapptracecore)\.framework/(apptrace|libapptracecore)$' || true
            unzip -l "$OUT" | grep -E 'Payload/uuvpn.app/(links|shell)\.txt' || true
          }

          package "build-mha/Build/Products/Release-iphoneos/uuvpn.app" uuvpn-mha-adhoc.ipa
          package "build-chat/Build/Products/Release-iphoneos/uuvpn.app" uuvpn-chat-adhoc.ipa

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uuvpn-ipa
          path: |
            uuvpn-mha-adhoc.ipa
            uuvpn-chat-adhoc.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-mha.log
            build-chat.log
          if-no-files-found: ignore
          retention-days: 14
